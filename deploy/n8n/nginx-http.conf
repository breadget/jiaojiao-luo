server {
    listen 80;
    listen [::]:80;
    server_name n8n.urtoris.cn;
    client_max_body_size 128k;
    limit_conn urtoris_connections 12;
    add_header X-Content-Type-Options "nosniff" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Header Auth remains mandatory; the website calls n8n over loopback.
    location ^~ /webhook/urtoris/ {
        limit_req zone=urtoris_webhook_guard burst=5 nodelay;
        proxy_pass http://127.0.0.1:5678;
        include /etc/nginx/snippets/urtoris-proxy.conf;
    }

    # Administration uses SSH; it is not reachable over the public domain/IP.
    location / {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:5678;
        include /etc/nginx/snippets/urtoris-proxy.conf;
        proxy_buffering off;
    }
}
