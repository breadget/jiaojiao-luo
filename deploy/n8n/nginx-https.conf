server {
    listen 80;
    listen [::]:80;
    server_name n8n.urtoris.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://n8n.urtoris.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name n8n.urtoris.cn;
    ssl_certificate /etc/letsencrypt/live/n8n.urtoris.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.urtoris.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 128k;
    limit_conn urtoris_connections 12;

    location ^~ /webhook/urtoris/ {
        limit_req zone=urtoris_webhook_guard burst=5 nodelay;
        proxy_pass http://127.0.0.1:5678;
        include /etc/nginx/snippets/urtoris-proxy.conf;
    }

    location / {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:5678;
        include /etc/nginx/snippets/urtoris-proxy.conf;
        proxy_buffering off;
    }
}
