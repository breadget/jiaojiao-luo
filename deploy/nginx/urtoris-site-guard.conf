include /etc/nginx/snippets/urtoris-security-headers.conf;
client_max_body_size 1m;
limit_conn urtoris_connections 24;
limit_req zone=urtoris_dynamic burst=30 nodelay;
limit_req zone=urtoris_api burst=20 nodelay;
limit_req zone=urtoris_expensive burst=3 nodelay;

if ($urtoris_invalid_method) { return 405; }
if ($urtoris_unused_server_action) { return 400; }
if ($urtoris_non_api_write) { return 405; }
error_page 429 = @urtoris_throttled;
location @urtoris_throttled {
    include /etc/nginx/snippets/urtoris-security-headers.conf;
    add_header Retry-After "5" always;
    default_type application/json;
    charset utf-8;
    return 429 '{"error":"请求过于频繁，请稍后重试。"}';
}

location ^~ /.well-known/acme-challenge/ {
    root /var/lib/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
}
location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
location ~* \.(php[0-9]?|phtml|asp|aspx|cgi|bak|old|sql|sqlite|pem|key|log|map)(/|$) { return 404; }
location ~* ^/(wp-admin|wp-content|wp-includes|cgi-bin|phpmyadmin|actuator|vendor)(/|$) { return 404; }
location ^~ /api/local-control/ { return 404; }
location ^~ /api/local-store/ { return 404; }

# Preserve the documented upload limit without raising JSON API limits.
location = /api/python/files {
    client_max_body_size 25m;
    client_body_timeout 60s;
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/urtoris-proxy.conf;
}
location / {
    proxy_pass http://127.0.0.1:3000;
    include /etc/nginx/snippets/urtoris-proxy.conf;
}
