# Loaded in http context. Static bundles are exempt from request-rate limits;
# connection limits still apply to stop one client occupying all workers.
server_tokens off;
client_header_timeout 10s;
client_body_timeout 30s;
send_timeout 30s;
keepalive_timeout 30s;
reset_timedout_connection on;

map $uri $urtoris_dynamic_key {
    default $binary_remote_addr;
    ~^/_next/static/ "";
    /favicon.ico "";
}
map $uri $urtoris_api_key {
    default "";
    ~^/api/ $binary_remote_addr;
}
map $uri $urtoris_expensive_key {
    default "";
    ~^/api/(agent/chat|python/agent|workflows/agent)/?$ $binary_remote_addr;
}
map $http_upgrade $urtoris_connection_upgrade {
    default upgrade;
    "" close;
}
map $request_method $urtoris_invalid_method {
    default 1;
    GET 0;
    HEAD 0;
    POST 0;
    PUT 0;
    PATCH 0;
    DELETE 0;
    OPTIONS 0;
}
map $http_next_action $urtoris_unused_server_action {
    default 1;
    "" 0;
}
map "$request_method:$uri" $urtoris_non_api_write {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):/(?!api/) 1;
}

limit_req_zone $urtoris_dynamic_key zone=urtoris_dynamic:10m rate=10r/s;
limit_req_zone $urtoris_api_key zone=urtoris_api:10m rate=6r/s;
limit_req_zone $urtoris_expensive_key zone=urtoris_expensive:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=urtoris_webhook_guard:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=urtoris_connections:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
