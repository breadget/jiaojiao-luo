add_header X-Urtoris-Origin "aliyun" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), payment=()" always;
# No includeSubDomains: n8n's public HTTPS is not configured yet.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'" always;
