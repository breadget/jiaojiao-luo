server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name urtoris.cn www.urtoris.cn;
    ssl_certificate /etc/letsencrypt/live/urtoris.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urtoris.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/urtoris-site-guard.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name urtoris.cn www.urtoris.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
